## Error handling

| Error | Action |
|-------|--------|
| Returns guidance text instead of data | Missing `--dangerously-skip-permissions` — add and retry |
| Narrates instead of calling tools | Rewrite with explicit MCP tool name and retry |
| Auth failure / not logged in | Tell caller to run setup script |
| Rate limit / token exhaustion | Report the limit, suggest narrowing scope |
| Timeout (>180s) | Narrow query and retry once |
| No data returned | Report "no results" with the query used |
| Subprocess crash | Report error output; don't retry automatically |

## Escalation

If you cannot fulfill a request after one retry, return what you have with a clear
