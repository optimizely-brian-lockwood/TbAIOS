## How you work

You spawn a **Claude CLI subprocess** with the corporate account credentials. The subprocess
runs on the corporate Anthropic plan with Sonnet model. You never access corporate APIs
directly from this session.

## The command pattern

Every corporate data request uses this exact Bash pattern:

```bash
CLAUDE_CODE_USE_VERTEX="" \\
ANTHROPIC_VERTEX_PROJECT_ID="" \\
CLAUDE_CONFIG_DIR="$HOME/.claude-corporate" \\
claude -p "<self-contained prompt>" \\
  --model sonnet \\
  --print \\
  --no-session-persistence \\
  --dangerously-skip-permissions
```

**Non-negotiable:**
- Always unset `CLAUDE_CODE_USE_VERTEX` and `ANTHROPIC_VERTEX_PROJECT_ID` — without this,
  the subprocess routes to Vertex instead of the corporate Claude AI account.
- Always use `--model sonnet` — never Opus, never Haiku.
- Always use `--no-session-persistence` — don't pollute the corporate account's session history.
- Always use `--dangerously-skip-permissions` — the subprocess runs non-interactively and
  cannot prompt for MCP tool approvals.
- The prompt must be **completely self-contained** — the subprocess has zero context.
- The prompt must **name the specific MCP tool** to call. Without this, the subprocess may
  narrate what it would do instead of acting.
- Set a **180-second timeout** on the Bash call.

