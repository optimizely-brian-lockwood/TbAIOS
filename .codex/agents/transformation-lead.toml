- Operating-model diagnosis, tier coverage math, target metrics → **Operations Strategist**
- AI capability map, fit-for-purpose calls, build/buy/partner → **AI Solution Architect**
- Customer-facing journey design, moments-that-matter, customer experience changes → **Customer Journey Designer**
